stages:
  - install
  - build
  - deploy

variables:
  SSH_PRIVATE_KEY: ""
  PROJECT_PATH: "$CI_PROJECT_DIR"
  APP_OUTPUT_PATH: "$CI_PROJECT_DIR/dist/browser"
  NPM_REGISTRY: "http://gdml.internal.ausl.bologna.it:4873/"
  ENVIRONMENT: "stage"
  BROWSER_APP_PATH: "pec"
  TARGET_USER: "nodejs"
  TARGET_SERVER_NAME: "gdml.internal.ausl.bologna.it"
  TARGET_DIST_PATH: "/opt/uis/shpeck-ui/dist"

# Configuration shared for all jobs
default:
  # It saves ~10 sec to pull image from project container registry
  # instead of the default docker.io registry
  image: node:20.14
  tags:
    - babel

# Define an hidden job to be used with extends
# Better than default to avoid activating cache for all jobs
.dependencies_cache:
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
    policy: pull

install_dependencies:
  stage: install
  script:
    - npm config set registry $NPM_REGISTRY -g
    - npm config set fetch-retry-mintimeout 5 -g
    - npm config set fetch-retry-maxtimeout 5 -g
    - yarn install
    # Redefine cache to have default pull-push policy
  extends: .dependencies_cache
  cache:
    policy: pull-push
  only:
    changes:
      - package.json
      - force_deploy

build_app:
  stage: build
  script:
    - yarn build --configuration $ENVIRONMENT --base-href /$BROWSER_APP_PATH/ --output-path dist
  artifacts:
    name: "dist-files"
    paths:
      - $APP_OUTPUT_PATH
  extends: .dependencies_cache

deploy_app:
  stage: deploy
  script:
    - (echo "$SSH_PRIVATE_KEY" | base64 -d) > key.pk
    - chmod 600 key.pk
    - ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentityFile=key.pk $TARGET_USER@$TARGET_SERVER_NAME  "rm -rf $TARGET_DIST_PATH/*"
    - scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentityFile=key.pk $APP_OUTPUT_PATH/* $TARGET_USER@$TARGET_SERVER_NAME:$TARGET_DIST_PATH/
  dependencies:
    - build_app
