<div
  class="container-accessibilita-mailbox"
  [ngClass]="
    fontSize === 'small'
      ? 'general-font-size-small'
      : fontSize === 'medium'
        ? 'general-font-size-medium'
        : 'general-font-size-big'
  "
  >
  <div>
    <app-toolbar mode="intestazione-accessibilita"></app-toolbar>
  </div>
  @if (true) {
    <div
      #mailContainer
      class="mail-container"
      >
      <!-- Left side -->
      <div
        #mailFolder
        class="content-left"
        >
        <app-mail-folders></app-mail-folders>
      </div>
      <div
        #leftSlider
        class="slider text-center"
        >
        <div></div>
      </div>
      <div
        #rightSide
        class="content-right"
        >
        <router-outlet></router-outlet>
      </div>
    </div>
  }
</div>
<p-toast
  key="c"
  position="center"
></p-toast>
