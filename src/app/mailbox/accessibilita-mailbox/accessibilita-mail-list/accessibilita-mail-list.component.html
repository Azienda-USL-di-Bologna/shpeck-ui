<p-table
  #dt
  tabindex="0"
  *ngIf="mostratable && (_selectedTag || _selectedFolder || _filters)"
  [value]="mailListService.messages"
  (onLazyLoad)="lazyLoad($any($event))"
  [lazy]="true"
  [lazyLoadOnInit]="true"
  [loading]="loading"
  [scrollable]="true"
  scrollHeight="flex"
  [(first)]="first"
  [paginator]="true"
  [rows]="rowsNmber"
  [totalRecords]="mailListService.totalRecords"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Visualizzate da {first} a {last} di {totalRecords} e-mail"
  [rowsPerPageOptions]="[10, 25, 50]"
  class="shpeck-mail-list-accessibile"
  aria-label="Tabella elenco mail"
  role="table"
>
  <ng-template pTemplate="header">
    <tr>
      <th
        *ngIf="_selectedFolder !== null && (_selectedFolder.type === folderTypeSent || _selectedFolder.type === folderTypeOutbox)"
        role="columnheader"
      >
        A
      </th>
      <th
        *ngIf="_selectedFolder !== null && _selectedFolder.type === folderTypeInbox"
        role="columnheader"
      >
        Da
      </th>
      <th
        *ngIf="
          _selectedTag !== null ||
          (_selectedFolder !== null &&
            _selectedFolder.type !== folderTypeSent &&
            _selectedFolder.type !== folderTypeOutbox &&
            _selectedFolder.type !== folderTypeInbox)
        "
        role="columnheader"
      >
        Da/A
      </th>
      <th role="columnheader">Oggetto</th>
      <th role="columnheader">Data</th>
    </tr>
  </ng-template>
  <ng-template
    pTemplate="body"
    let-message
  >
    <tr
      #selRow
      [attr.name]="message.id"
      role="row"
    >
      <!-- [pSelectableRow]="message" (keydown.enter)="vaiAlDettaglio($event, message, message)" -->
      <td>
        <div
          *ngFor="
            let element of buildAddressColumn(
              message,
              _selectedTag !== null || (_selectedFolder !== null && _selectedFolder.type !== folderTypeInbox)
            )
          "
          role="cell"
        >
          {{ element }}
        </div>
      </td>
      <td role="row">
        <a
          (click)="vaiAlDettaglio($event, message, message)"
          style="font-weight: bold; cursor: pointer"
        >
          <span role="cell">{{ message.subject }}</span></a
        >
      </td>
      <td role="row">
        <span role="cell">
          {{ message.receiveTime | date : "dd/MM/yyyy hh:mm" }}
        </span>
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  *ngIf="displayDetailPopup"
  [(visible)]="displayDetailPopup"
  class="popup-mail-detail"
>
  <p-header> Dettaglio </p-header>
  <p-footer>
    <button
      type="button"
      pButton
      (click)="displayDetailPopup = false"
      label="Chiudi"
      class="ui-button-raised ui-button-secondary button-styles custom-secondary-button"
    ></button>
  </p-footer>
</p-dialog>
