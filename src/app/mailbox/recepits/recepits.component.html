<p-table stripedRows
  [value]="recepits"
  [columns]="cols"
  [scrollable]="true"
  scrollHeight="18.75rem"
  appendTo="body"
>
  <ng-template
    pTemplate="header"
    let-columns
  >
    <tr>
      <th
        *ngFor="let col of columns"
        [style.width]="col.style?.width"
      >
        {{ col.header }}
      </th>
    </tr>
  </ng-template>
  <ng-template
    pTemplate="body"
    let-rowData
    let-columns="columns"
  >
    <tr>
      <td
        style="width: 8.438rem"
        class="align-center"
      >
        {{ rowData.receiveTime | date: "EE d MMM y, H:mm" | titlecase }}
      </td>
      <td
        style="width: 7.5rem"
        class="align-center"
      >
        {{ rowData.idRecepit.recepitType }}
      </td>
      <td style="width: 16.25rem">
        {{ calculateAddress(rowData) }}
      </td>
      <td
        style="width: 2.813rem"
        class="align-center"
      >
        <button
          pButton
          icon="pi pi-download"
          (click)="dowloadRecepit(rowData)"
          pTooltip="Scarica la ricevuta"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>
