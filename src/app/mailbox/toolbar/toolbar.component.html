<p-toolbar>
  <!-- (keyup.Control)="onKeyUpMoveFocus($event)" -->
  <div class="toolbar-container">
    <div
      class="d-flex toolbar-pec"
      aria-hidden="true"
      tabindex="-1"
    >
      <!-- Nuova Pec -->
      <button
        pButton
        type="button"
        label="Nuova PEC"
        tabindex="-1"
        icon="pi pi-plus"
        class="button-new-mail ui-button-raised ui-button-primary custom-primary-button"
        (click)="handleEvent($event, 'new'); this.toolBarService.isDialogOpen = true"
        onclick="this.blur()"
        [disabled]="!(toolBarService.buttonObs.get('newMailActive') | async) || this.toolBarService.isDialogOpen"
      ></button>
      <!-- Modifica -->
      <button
        *ngIf="toolBarService.buttonObs.get('editVisible') | async"
        pButton
        type="button"
        label="Modifica"
        tabindex="-1"
        icon="fa fa-pen"
        class="button-styles ui-button-raised ui-button-secondary custom-border"
        (click)="handleEvent($event, 'edit'); this.toolBarService.isDialogOpen = true"
        [disabled]="
          !((toolBarService.buttonObs.get('editActive') | async) && (toolBarService.buttonObs.get('newMailActive') | async)) ||
          this.toolBarService.isDialogOpen
        "
      ></button>
      <!-- Rispondi -->
      <button
        pButton
        type="button"
        label="Rispondi"
        tabindex="-1"
        icon="fa fa-reply"
        class="button-styles ui-button-raised ui-button-secondary custom-border"
        (click)="handleEvent($event, 'reply'); this.toolBarService.isDialogOpen = true"
        [disabled]="
          !((toolBarService.buttonObs.get('buttonsActive') | async) && (toolBarService.buttonObs.get('newMailActive') | async)) ||
          this.toolBarService.isDialogOpen
        "
      ></button>
      <!-- Rispondi a tutti -->
      <button
        pButton
        type="button"
        label="Rispondi a tutti"
        tabindex="-1"
        icon="fa fa-reply-all"
        class="button-styles ui-button-raised ui-button-secondary custom-border"
        (click)="handleEvent($event, 'reply_all'); this.toolBarService.isDialogOpen = true"
        [disabled]="
          !((toolBarService.buttonObs.get('buttonsActive') | async) && (toolBarService.buttonObs.get('newMailActive') | async)) ||
          this.toolBarService.isDialogOpen
        "
      ></button>
      <!-- Inoltra -->
      <button
        pButton
        type="button"
        label="Inoltra"
        tabindex="-1"
        icon="fa fa-share"
        class="button-styles ui-button-raised ui-button-secondary custom-border"
        (click)="handleEvent($event, 'forward'); this.toolBarService.isDialogOpen = true"
        [disabled]="
          !((toolBarService.buttonObs.get('buttonsActive') | async) && (toolBarService.buttonObs.get('newMailActive') | async)) ||
          this.toolBarService.isDialogOpen
        "
      ></button>
      <!-- Elimina -->
      <button
        pButton
        type="button"
        [label]="toolBarService.deleteLabel | async"
        tabindex="-1"
        icon="fa fa-trash"
        class="button-styles ui-button-raised ui-button-secondary custom-border"
        (click)="handleEvent($event, 'delete')"
        [disabled]="!(toolBarService.buttonObs.get('deleteActive') | async)"
      ></button>
      <!-- Sposta -->
      <button
        pButton
        type="button"
        label="Sposta"
        tabindex="-1"
        icon="fa fa-folder"
        class="button-styles ui-button-raised ui-button-secondary custom-border"
        (click)="handleEvent($event, 'move')"
        [disabled]="!(toolBarService.buttonObs.get('moveActive') | async)"
      >
        <!-- <img class="images-pos" src="assets/images/icons/folder_export.png" width="" alt="Sposta in">     margin-l-15-->
      </button>
      <p-menu
        #moveMenu
        (mouseleave)="handleEvent($event, 'mouseout')"
        class="move-menu"
        [popup]="true"
        [model]="moveMenuItems"
      ></p-menu>
      <!-- Fascicola -->
      <button
        pButton
        type="button"
        label="Fascicola"
        tabindex="-1"
        icon="fa fa-server"
        class="button-styles ui-button-raised ui-button-secondary custom-border rotate"
        (click)="handleEvent($event, 'archive')"
        [disabled]="!(toolBarService.buttonObs.get('archiveActive') | async)"
      ></button>
      <p-menu
        #archiveMenu
        (mouseleave)="handleEvent($event, 'mouseout')"
        [popup]="true"
        [model]="archiveMenuItems"
      ></p-menu>
      <!-- SPINNER GENERICO DA ATTIVARE ALL'OCCORRENZA-->
      <span *ngIf="toolBarService.loadingSpinner">
        <p-progressSpinner
          [style]="{ width: '2rem', height: '2rem', marginRight: '0.438rem' }"
          strokeWidth="8"
          fill="#FFFFFF"
          animationDuration=".5s"
        >
        </p-progressSpinner>
      </span>
      <!-- <i class="pi pi-bars a-items-center d-flex"></i> -->
    </div>
    <div class="d-flex toolbar-pec cerca-box">
      <!-- Ricerca -->
      <!-- (keyup.Control)="onKeyUpMoveFocus($event)"  -->
      <!-- title="barra di ricerca" -->
      <!-- Non metto aria-label="Ricerca messaggi" perché viene letto il placeholder -->
      <!-- Non metto role="search" perché altrimenti legge "Punto di riferimento" .. e invece l'ho messo.. mah -->
      <!--  -->
      <div class="search-wrapper">
        <button
          class="custom-search-button icon-button pi pi-search"
          aria-label="Ricerca"
          (click)="onSearch(search.value, true)"
          pTooltip="Ricerca"
          tooltipPosition="bottom"
        ></button>
        <input
          #search
          [attr.aria-label]="getDescrizioneCerca()"
          type="text"
          pInputText
          size="30"
          required
          placeholder="Cerca..."
          (keyup.enter)="onSearch(search.value, true)"
          (keyup)="onSearch(search.value, false)"
          class="input-find"
          [pTooltip]="
            (toolBarService.buttonObs.get('searchActive') | async) ? 'Inserire almeno 3 caratteri e premere invio' : null
          "
          tooltipPosition="bottom"
          minlength="3"
          [disabled]="!(toolBarService.buttonObs.get('searchActive') | async)"
        />
        <button
          class="reset-filters-icon icon-button pi pi-times"
          [ngClass]="{'hide': (numeroFiltriApplicati === '0' && (search.value == null || search.value.length === 0))}"
          aria-label="Cancella ricerca"
          pTooltip="Cancella ricerca"
          tooltipPosition="bottom"
          (click)="clearInput(true)"
        >
        </button>
        <p-button 
          class="button-ricerca-avanzata button-styles ui-button-raised ui-button-secondary custom-border rotate"
          [badge]="numeroFiltriApplicati" 
          [pTooltip]="stringaElencoFiltriApplicati === '' ? 'Mostra opzioni di ricerca' : 'Filtri attualmente inseriti:\n' + stringaElencoFiltriApplicati"
          tooltipPosition="bottom"
          badgeClass="p-badge-contrast" 
          [icon]="iconaRicercaAvanzata"
          [ngClass]="{'ricerca-in-corso': numeroFiltriApplicati !== '0'}"
          outlined="true" 
          (onClick)="op.toggle($event)"/>
      </div>
      <p-overlayPanel #op class="panel-ricerca-avanzata" [style]="{ width: '70rem;' }"><!-- (onHide)="" -->
        <div class="panel-ricerca-avanzata-content">
          <div class="filtro calendari">
            <label>Filtra per data ricezione/invio</label>
            <custom-calendar #calendarRicercaAvanzata
              (intervalDateSelected)="intervalDateSelected($event)"
            ></custom-calendar>
          </div>
          <div class="filtro box-reindirizzati">
            <p-checkbox
              [binary]="true"
              [(ngModel)]="ricercaAvanzataFilters.soloReindirizzati"
              inputId="soloReindirizzatiId"
            ></p-checkbox>
            <label for="soloReindirizzatiId">Solo messaggi reindirizzati</label>
          </div>
          <div class="footer">
            <p-button 
              class="button-cerca button-styles ui-button-raised ui-button-secondary custom-border rotate"
              label="Cerca" 
              outlined="true" 
              (onClick)="avviaRicercaAvanzata(); op.toggle($event)"/>
          </div>
        </div>
        
      </p-overlayPanel>
    </div>
  </div>
</p-toolbar>
<p-confirmDialog
  #cd
  [style]="{ width: '22.5vw' }"
>
  <p-footer>
    <button
      type="button"
      class="buttons ui-button-raised ui-button-secondary custom-secondary-button"
      pButton
      icon="fas fa-check"
      label="Sì"
      (click)="cd.accept()"
    ></button>
    <button
      type="button"
      class="buttons ui-button-raised ui-button-secondary custom-secondary-button"
      pButton
      icon="fas fa-times"
      label="No"
      (click)="cd.reject()"
    ></button>
  </p-footer>
</p-confirmDialog>

<p-dialog
  header="Attenzione"
  [(visible)]="showErrorDialog"
  [responsive]="true"
  [modal]="true"
  appendTo="body"
  [focusTrap]="true"
>
  <p>Inserire almeno 3 caratteri e premere invio!</p>
  <p-footer>
    <button
      #closeDialog
      pButton
      icon="pi pi-times"
      (click)="toggleDialogAndAddFocus()"
      label="Chiudi"
      class="ui-button-secondary"
      autofocus
    ></button>
  </p-footer>
</p-dialog>
