<div
  class="container-mailbox-component"
  [ngClass]="
    fontSize === 'small'
      ? 'general-font-size-small'
      : fontSize === 'medium'
      ? 'general-font-size-medium'
      : 'general-font-size-big'
  "
>
  <app-toolbar></app-toolbar>

  <p-splitter 
    [panelSizes]="[20,80]" 
    [minSizes]="[10, 50]"
    styleClass="splitter-padre">
    <ng-template #panel>
      <app-mail-folders></app-mail-folders>
    </ng-template>
    <ng-template #panel>
      <p-splitter
        [panelSizes]="[50,50]" 
        [minSizes]="[20, 20]"
        styleClass="splitter-figlio">
        <ng-template #panel>
          <div
            #mailList
            class="mail-list"
            [attr.aria-label]="
              _selectedFolder
                ? 'La lista dei messagi nella cartella'
                : _selectedTag
                ? 'La lista dei messagi nell etichetta'
                : 'Lista messaggi vuota'
            "
          >
            <div
              class="filter-box"
              aria-hidden="true"
            >
              <div class="filter-box-left">
                {{
                  _selectedFolder ? _selectedFolder.description : _selectedTag ? _selectedTag.description : _selectedPec?.indirizzo
                }}
              </div>
              <!--  {{totalMessageNumberDescriptor? '(' + totalMessageNumberDescriptor.messageNumber + ')': ''}} -->
              <div
                class="filter-box-right"
                (click)="sortingmenu.toggle($event)"
                [pTooltip]="tooltipSorting"
              >
                {{ sortingLabel }}
              </div>
            </div>
            <p-menu
              #sortingmenu
              appendTo="body"
              [showTransitionOptions]="'0ms'"
              [hideTransitionOptions]="'0ms'"
              [popup]="true"
              [model]="sortMenuItem"
            ></p-menu>
            <app-mail-list
              *ngIf="componentToLoad === 'mail-list'"
              (messageClicked)="messageClicked($event)"
            >
            </app-mail-list>
            <app-mail-drafts
              *ngIf="componentToLoad === 'mail-draft'"
              [pecId]="_selectedPecId"
            ></app-mail-drafts>
            <app-mail-outbox
              *ngIf="componentToLoad === 'mail-outbox'"
              [pecId]="_selectedPecId"
            ></app-mail-outbox>
          </div>
        </ng-template>
        <ng-template #panel>
          <div
            [ngClass]="hideDetail ? 'hidden' : 'mail-detail'"
            #mailDetail
            tabindex="0"
            aria-label="Dettaglio del messaggio selezionato"
          >
            <div [ngClass]="{ 'overlap-div': sliding }"></div>
            <app-mail-detail
              [message]="message"
              [versioneAccessibile]="false"
            >
            </app-mail-detail>
          </div>
        </ng-template>
      </p-splitter>
    </ng-template>
  </p-splitter>
</div>

<p-toast position="top-right"></p-toast>
<p-toast
  key="c"
  position="center"
></p-toast>
